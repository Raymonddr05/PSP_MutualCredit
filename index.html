<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Open Manifesto</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background-color: #fafafa;
        }
        iframe {
            display: block;
            border: 0;
            width: 100%;
            height: 100%;
        }
    </style>
    <script>
        // Phones and tablets often can't show embedded PDFs properly,
        // so send them straight to the PDF and its built-in viewer.
        (function () {
            var ua = navigator.userAgent;
            var isIPadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
            if (/Android|iPhone|iPad|iPod/i.test(ua) || isIPadOS) {
                location.replace("/My_Open_Manifesto.pdf");
            }
        })();
    </script>
</head>
<body>
    <iframe src="/My Open Manifesto.pdf" title="My Open Manifesto"></iframe>
    <noscript>
        <p style="font-family: sans-serif; padding: 16px;">
            <a href="/My Open Manifesto.pdf">Open My Open Manifesto (PDF)</a>
        </p>
    </noscript>
</body>
</html>
